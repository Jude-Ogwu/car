<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Orders &amp; Inquiries — CarVoyage Admin</title>
    <link rel="shortcut icon" href="../assets/media/favicon.png">
    <link rel="stylesheet" href="../assets/css/vendor/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/vendor/font-awesome.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">
<div class="admin-sidebar" id="sidebar">
    <div class="sidebar-brand">
        <img src="../assets/media/logo.png" alt="CarVoyage" class="sidebar-logo">
        <span class="sidebar-label">Admin</span>
        <button class="sidebar-close-btn" id="sidebar-close" title="Close menu"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-gauge-high"></i><span>Dashboard</span></a>
        <a href="cars.html" class="nav-item"><i class="fa-solid fa-car"></i><span>Manage Cars</span></a>
        <a href="categories.html" class="nav-item"><i class="fa-solid fa-tags"></i><span>Categories</span></a>
        <a href="orders.html" class="nav-item active"><i class="fa-solid fa-file-invoice-dollar"></i><span>Orders &amp; Inquiries</span></a>
        <hr class="sidebar-divider">
        <a href="../index.html" class="nav-item" target="_blank"><i class="fa-solid fa-globe"></i><span>View Website</span></a>
        <a href="#" class="nav-item" id="logout-btn"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></a>
    </nav>
</div>
<div class="sidebar-overlay" id="sidebar-overlay"></div>

<div class="admin-main">
    <header class="admin-topbar">
        <button class="sidebar-toggle" id="sidebar-toggle"><i class="fa-solid fa-bars"></i></button>
        <div class="topbar-title"><h5>Orders &amp; Inquiries</h5></div>
        <div class="topbar-right">
            <span id="orders-badge" class="badge bg-warning text-dark"></span>
        </div>
    </header>

    <div class="admin-content">
        <div class="row g-3 mb-4">
            <div class="col-md-3 col-6"><div class="mini-stat"><div class="mini-stat-val text-warning" id="os-new">–</div><div class="mini-stat-label">New</div></div></div>
            <div class="col-md-3 col-6"><div class="mini-stat"><div class="mini-stat-val text-info" id="os-inprogress">–</div><div class="mini-stat-label">In Progress</div></div></div>
            <div class="col-md-3 col-6"><div class="mini-stat"><div class="mini-stat-val text-success" id="os-closed">–</div><div class="mini-stat-label">Closed</div></div></div>
            <div class="col-md-3 col-6"><div class="mini-stat"><div class="mini-stat-val text-primary" id="os-revenue">–</div><div class="mini-stat-label">Revenue</div></div></div>
        </div>

        <div class="admin-card mb-4">
            <div class="d-flex gap-3 align-items-center p-3 flex-wrap">
                <input type="text" id="order-search" class="form-control" style="max-width:280px;" placeholder="Search customer or car...">
                <select id="filter-order-status" class="form-select" style="max-width:180px;">
                    <option value="">All Statuses</option>
                    <option value="New">New</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Closed">Closed</option>
                </select>
                <span id="orders-count" class="text-muted ms-auto"></span>
            </div>
        </div>

        <div class="admin-card">
            <div class="table-responsive">
                <table class="table admin-table mb-0">
                    <thead>
                        <tr><th>#ID</th><th>Customer</th><th>Car</th><th>Price</th><th>Message</th><th>Status</th><th>Date</th><th>Actions</th></tr>
                    </thead>
                    <tbody id="orders-tbody">
                        <tr><td colspan="8" class="text-center py-4 text-muted">Loading orders...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Order Detail Modal -->
<div class="modal fade" id="orderModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content admin-modal">
            <div class="modal-header">
                <h5 class="modal-title">Inquiry Detail</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="order-detail-body"></div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-warning" id="btn-mark-progress"><i class="fa-solid fa-spinner me-1"></i>Mark In Progress</button>
                <button type="button" class="btn btn-success" id="btn-mark-closed"><i class="fa-solid fa-circle-check me-1"></i>Mark Closed</button>
            </div>
        </div>
    </div>
</div>

<script src="../assets/js/vendor/bootstrap.min.js"></script>
<script src="../assets/js/vendor/jquery-3.6.3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/data.js"></script>
<script>
    AdminAuth.requireAuth();

    var sidebar = document.getElementById('sidebar');
    var overlay = document.getElementById('sidebar-overlay');

    function closeSidebar() { sidebar.classList.remove('mobile-open'); overlay.classList.remove('active'); }

    document.getElementById('sidebar-toggle').addEventListener('click', function() {
        if (window.innerWidth <= 768) { sidebar.classList.toggle('mobile-open'); overlay.classList.toggle('active'); }
        else { sidebar.classList.toggle('collapsed'); }
    });
    document.getElementById('sidebar-close').addEventListener('click', closeSidebar);
    overlay.addEventListener('click', closeSidebar);

    document.getElementById('logout-btn').addEventListener('click', function(e) {
        e.preventDefault(); AdminAuth.logout(); window.location.href = 'login.html';
    });

    var orderModal = new bootstrap.Modal(document.getElementById('orderModal'));
    var currentOrderId = null;
    var statusColors = { 'New': 'warning', 'In Progress': 'info', 'Closed': 'success' };

    async function loadStats() {
        var s = await OrderStore.getStats();
        document.getElementById('os-new').textContent = s.newOrders;
        document.getElementById('os-inprogress').textContent = s.inProgress;
        document.getElementById('os-closed').textContent = s.closed;
        document.getElementById('os-revenue').textContent = '$' + s.revenue.toLocaleString();
        document.getElementById('orders-badge').textContent = s.newOrders + ' new';
    }

    async function renderOrders() {
        var search = document.getElementById('order-search').value.toLowerCase();
        var status = document.getElementById('filter-order-status').value;
        var orders = (await OrderStore.getAll()).filter(function(o) {
            if (status && o.status !== status) return false;
            if (search &&
                !(o.customer_name||'').toLowerCase().includes(search) &&
                !(o.car_name||'').toLowerCase().includes(search) &&
                !(o.email||'').toLowerCase().includes(search)) return false;
            return true;
        });
        document.getElementById('orders-count').textContent = orders.length + ' inquiry(s)';
        var tbody = document.getElementById('orders-tbody');
        if (!orders.length) {
            tbody.innerHTML = '<tr><td colspan="8" class="text-center py-4 text-muted">No orders found.</td></tr>';
            return;
        }
        tbody.innerHTML = orders.map(function(o) {
            var d = new Date(o.date_submitted || o.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            var msg = o.message ? (o.message.length > 50 ? o.message.substring(0, 50) + '...' : o.message) : '–';
            return '<tr>' +
                '<td><strong>#' + o.id + '</strong></td>' +
                '<td><strong>' + (o.customer_name||'–') + '</strong><br><small class="text-muted">' + (o.email||'') + '</small><br><small>' + (o.phone||'') + '</small></td>' +
                '<td>' + (o.car_name||'–') + '</td>' +
                '<td>$' + (o.total_price||0).toLocaleString() + '</td>' +
                '<td><small class="text-muted">' + msg + '</small></td>' +
                '<td><span class="badge bg-' + (statusColors[o.status]||'secondary') + '">' + o.status + '</span></td>' +
                '<td>' + d + '</td>' +
                '<td>' +
                '<button class="btn btn-sm btn-outline-primary me-1" onclick="viewOrder(' + o.id + ')"><i class="fa-solid fa-eye"></i></button>' +
                '<button class="btn btn-sm btn-outline-danger" onclick="deleteOrder(' + o.id + ')"><i class="fa-solid fa-trash"></i></button>' +
                '</td></tr>';
        }).join('');
    }

    async function viewOrder(id) {
        var o = await OrderStore.getById(id);
        if (!o) return;
        currentOrderId = id;
        var d = new Date(o.date_submitted || o.created_at).toLocaleString('en-US');
        document.getElementById('order-detail-body').innerHTML =
            '<dl class="row">' +
            '<dt class="col-4">Customer</dt><dd class="col-8"><strong>' + (o.customer_name||'–') + '</strong></dd>' +
            '<dt class="col-4">Email</dt><dd class="col-8"><a href="mailto:' + (o.email||'') + '">' + (o.email||'–') + '</a></dd>' +
            '<dt class="col-4">Phone</dt><dd class="col-8">' + (o.phone||'–') + '</dd>' +
            '<dt class="col-4">Car</dt><dd class="col-8">' + (o.car_name||'–') + '</dd>' +
            '<dt class="col-4">Price</dt><dd class="col-8">$' + (o.total_price||0).toLocaleString() + '</dd>' +
            '<dt class="col-4">Status</dt><dd class="col-8"><span class="badge bg-' + (statusColors[o.status]||'secondary') + '">' + o.status + '</span></dd>' +
            '<dt class="col-4">Date</dt><dd class="col-8">' + d + '</dd>' +
            '<dt class="col-4">Message</dt><dd class="col-8">' + (o.message||'–') + '</dd></dl>';
        orderModal.show();
    }

    async function deleteOrder(id) {
        if (confirm('Delete this inquiry? This cannot be undone.')) {
            await OrderStore.delete(id);
            renderOrders();
            loadStats();
        }
    }

    document.getElementById('btn-mark-progress').addEventListener('click', async function() {
        if (!currentOrderId) return;
        await OrderStore.updateStatus(currentOrderId, 'In Progress');
        orderModal.hide(); renderOrders(); loadStats();
    });

    document.getElementById('btn-mark-closed').addEventListener('click', async function() {
        if (!currentOrderId) return;
        await OrderStore.updateStatus(currentOrderId, 'Closed');
        orderModal.hide(); renderOrders(); loadStats();
    });

    document.getElementById('order-search').addEventListener('keyup', renderOrders);
    document.getElementById('filter-order-status').addEventListener('change', renderOrders);

    loadStats();
    renderOrders();
</script>
</body>
</html>
